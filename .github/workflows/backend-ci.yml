name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore src/PostPilot.Api/PostPilot.Api.csproj

      - name: Build API
        run: dotnet build src/PostPilot.Api/PostPilot.Api.csproj --configuration Release --no-restore

      - name: Restore Unit Tests
        run: dotnet restore tests/PostPilot.UnitTests/PostPilot.UnitTests.csproj

      - name: Test Unit Tests
        run: dotnet test tests/PostPilot.UnitTests/PostPilot.UnitTests.csproj --configuration Release --no-restore --verbosity normal
